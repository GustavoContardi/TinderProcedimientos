databaseChangeLog:
  - changeSet:
      id: 302-seed-demo-textos-generales-formales
      author: tinder-v2
      context: demo
      comment: >
        Resto de los textos de la demo con tono formal (mensajes de resultados, objeciones y respuestas, minuta,
        votos del casamiento, acta de defunción y mejoras). No cambia números, estados ni relaciones del seed 300.
      changes:
        - sqlFile:
            path: seed-demo-textos-generales.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            encoding: UTF-8
