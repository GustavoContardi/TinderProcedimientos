databaseChangeLog:
  - changeSet:
      id: 206-segunda-cita
      author: tinder-v2
      comment: Segunda cita formal con minuta, decisión y votación rápida. ciclo_id es NULL si nació de una objeción en la boda o en el aniversario.
      changes:
        - createTable:
            tableName: segunda_cita
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: procedimiento_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_cita_proc, references: procedimiento(id) } }
              - column: { name: ciclo_id, type: BIGINT, constraints: { nullable: true, foreignKeyName: fk_cita_ciclo, references: ciclo_votacion(id) } }
              - column: { name: fecha_programada, type: DATE, constraints: { nullable: false } }
              - column: { name: estado, type: VARCHAR(12), defaultValue: CONVOCADA, constraints: { nullable: false } }
              - column: { name: minuta, type: TEXT }
              - column: { name: decision, type: VARCHAR(25) }
              - column: { name: condiciones, type: TEXT }
              - column: { name: ciclo_rapido_id, type: BIGINT, constraints: { nullable: true, foreignKeyName: fk_cita_ciclo_rapido, references: ciclo_votacion(id) } }
        - sql:
            sql: >
              ALTER TABLE segunda_cita
                ADD CONSTRAINT ck_cita_estado CHECK (estado IN ('CONVOCADA','REALIZADA')),
                ADD CONSTRAINT ck_cita_decision CHECK (decision IS NULL OR decision IN ('AJUSTAR_Y_REVOTAR','CASAR_CON_CONDICIONES','VELORIO')),
                ADD CONSTRAINT ck_cita_realizada CHECK (estado = 'CONVOCADA' OR (minuta IS NOT NULL AND decision IS NOT NULL))
