databaseChangeLog:
  - changeSet:
      id: 011-velorio
      author: tinder
      changes:
        - createTable:
            tableName: velorio
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: procedimiento_id, type: BIGINT, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_velorio_proc, foreignKeyName: fk_velorio_proc, references: procedimiento(id) } }
              - column: { name: fecha, type: DATE, constraints: { nullable: false } }
              - column: { name: causa_muerte, type: TEXT, constraints: { nullable: false } }
              - column: { name: epitafio, type: TEXT, constraints: { nullable: false } }
              - column: { name: minutos_semanales_perdidos, type: INT, constraints: { nullable: false } }
              - column: { name: deudos, type: TEXT, defaultValue: nadie, constraints: { nullable: false } }
              - column: { name: acta_firmada, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: firmado_por, type: BIGINT, constraints: { nullable: true, foreignKeyName: fk_velorio_firmante, references: usuario(id) } }
              - column: { name: fecha_firma, type: TIMESTAMP }
