databaseChangeLog:
  - changeSet:
      id: 012-alerta
      author: tinder
      comment: Alertas para que Calidad revise (relación a distancia, obligatorio no velable, casamiento grupal).
      changes:
        - createTable:
            tableName: alerta
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: procedimiento_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_alerta_proc, references: procedimiento(id) } }
              - column: { name: ciclo_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_alerta_ciclo, references: ciclo_votacion(id) } }
              - column: { name: tipo, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: mensaje, type: TEXT, constraints: { nullable: false } }
              - column: { name: revisada, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - sql:
            sql: ALTER TABLE alerta ADD CONSTRAINT ck_alerta_tipo CHECK (tipo IN ('RELACION_A_DISTANCIA','OBLIGATORIO_NO_VELABLE','CANDIDATO_CASAMIENTO_GRUPAL'))
